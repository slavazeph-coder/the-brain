[pytest]
; macOS Accelerate BLAS sets spurious FP status flags inside blocked GEMM calls
; ("divide by zero / overflow / invalid encountered in matmul" on finite inputs
; with mathematically impossible division). Results are verified correct; Linux
; CI is unaffected. Scope the filter to this package's test runs only.
filterwarnings =
    ignore:.*encountered in matmul.*:RuntimeWarning

# DEPLOYMENT-ONLY BRANCH: deploy/world-worker-20261027.
# Do not merge this root configuration into main: main deploys the website.
# Application code is the tested main release; only this deployment config differs.
# Acceptance is an explicitly enabled synthetic test, never a physical qualification.

[build]
builder = "DOCKERFILE"
dockerfilePath = "robotics/world_worker/deploy/railway/Dockerfile"
watchPatterns = ["robotics/world_worker/**", "robotics/scene_compiler/**", "railway.toml"]

[deploy]
startCommand = "/bin/sh -c 'if [ \"${WORLD_DEPLOY_SMOKE:-0}\" = \"1\" ]; then /opt/worker/bin/python /app/robotics/world_worker/deploy/railway/acceptance.py --confirm-synthetic-deployment-test & fi; exec /app/robotics/world_worker/deploy/railway/start.sh'"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# DEPLOYMENT-ONLY BRANCH: deploy/world-worker-20261027.
# Keep the website's root configuration on main unchanged.
# The G1 startup check records installed code and runtime readiness; it never starts physics.
[build]
builder = "DOCKERFILE"
dockerfilePath = "robotics/world_worker/deploy/railway/Dockerfile"
watchPatterns = ["robotics/world_worker/**", "robotics/scene_compiler/**", "robotics/g1_trial/**", "robotics/splat_repair/**", "robotics/motion_retarget/**", "robotics/localization/**", "robotics/biomechanics/**", "railway.toml"]

[deploy]
startCommand = "/bin/sh /app/robotics/world_worker/deploy/railway/launch.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

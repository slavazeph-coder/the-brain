<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFC Viewer</title>
<style>
:root{--bg:#06060a;--surface:#0b0b12;--border:rgba(241,241,246,.1);--text:#f1f1f6;--muted:#9aa0b4;--cyan:#00f5ff;--purple:#a855f7;--font:Inter,ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);height:100vh;display:grid;grid-template-rows:54px 1fr}
header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);gap:16px}
header b{font-weight:550;letter-spacing:-.02em}header small,.micro{font:10px var(--mono);letter-spacing:.04em;color:var(--muted)}
.tag{font:9px var(--mono);letter-spacing:.08em;padding:4px 7px;border-radius:4px;border:1px solid #00f5ff44;color:var(--cyan)}
main{display:grid;grid-template-columns:1fr 400px;min-height:0}
#stage{position:relative;background:radial-gradient(ellipse at 50% 45%,#101222,#08090e 75%);min-height:0}#stage canvas{display:block;width:100%;height:100%}
#stage .stamp{position:absolute;left:18px;bottom:14px;font:10px var(--mono);color:#a5aac1;letter-spacing:.08em}
#drop{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}#drop[hidden]{display:none}
aside{border-left:1px solid var(--border);padding:16px 18px;overflow:auto;background:var(--surface)}
h2{font:10px var(--mono);letter-spacing:.12em;color:var(--cyan);margin:10px 0 5px}
.tree{margin:0 0 10px;padding:0;list-style:none;font-size:11px;line-height:1.35}.tree li{padding:1px 0;color:var(--muted)}.tree .lvl{font:9px var(--mono);color:#7d8299;margin-right:6px}
.el{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;color:var(--text);padding:3px 8px;font:12px var(--font);cursor:pointer}
.el:hover,.el[aria-pressed=true]{border-color:#00f5ff44;background:#00f5ff0a}.el i{width:8px;height:8px;border-radius:2px;flex-shrink:0}.el code{font:9px var(--mono);color:var(--muted);margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:4px}td{padding:2px 0;border-bottom:1px solid var(--border);vertical-align:top}td:first-child{color:var(--muted);font-family:var(--mono);font-size:10px;width:52%}
.false{color:#f1b9d1}.true{color:#9ff7c4}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head>
<body>
<header><div><b>IFC viewer</b> &nbsp;<small>web-ifc 0.0.77 (That Open Company, open source) · demo viewer, not part of brainsnn.com</small></div><div><span class="tag" id="schema">NO FILE</span> <small id="file-name"></small></div></header>
<main>
<div id="stage"><div id="drop"><label>Open an .ifc file <input type="file" id="file" accept=".ifc"></label></div><div class="stamp" id="stamp"></div></div>
<aside>
<h2>SPATIAL STRUCTURE</h2><ul class="tree" id="tree"></ul>
<h2 id="project-title" hidden>PROJECT · PSET_BRAINSNN</h2><table id="project"></table>
<div id="elements"></div>
<h2 id="pset-title" hidden>SELECTED ELEMENT · PSET_BRAINSNN</h2><table id="pset"></table>
</aside>
</main>
<script type="module" src="./viewer.mjs"></script>
</body>
</html>

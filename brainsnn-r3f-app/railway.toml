# Railway config for the BrainSNN app (TypeScript/Vite SPA + bundled Express).
# This subdirectory is the Railway service root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# GT3 handles its precise nested routes before the existing robot sponsor router.
# Existing product routes and preloads stay intact. Startup tests guard ordering.
startCommand = "node --require ./sponsorship/gt3/server.cjs --require ./brand-brain-preload.cjs --require ./mission-market-preload.cjs --require ./sponsorship/server.cjs dist/server.cjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/healthz"
healthcheckTimeout = 30

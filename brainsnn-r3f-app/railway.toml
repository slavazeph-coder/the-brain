# Railway config for the BrainSNN app (TypeScript/Vite SPA + bundled Express).
# This subdirectory is the Railway service root, so this file governs the
# production build/deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Brand Brain persistence is installed by a Node preload that wraps Express
# before server.cjs imports it. Keeping this command aligned with package.json
# and the Docker CMD is required for the /api/v1/brand-brain/* routes to exist
# in production.
startCommand = "node --require ./brand-brain-preload.cjs dist/server.cjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/healthz"
healthcheckTimeout = 30

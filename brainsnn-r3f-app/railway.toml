# Railway config for the BrainSNN app (TypeScript/Vite SPA + bundled Express).
# This subdirectory is the Railway service root, so this file governs the
# production build/deploy and overrides Dockerfile CMD.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# All additive middleware must load before the bundled server imports Express.
# Keep this command aligned with Dockerfile CMD; the sponsorship config test
# verifies that a healthy SPA cannot silently hide missing sponsor routes.
startCommand = "node --require ./brand-brain-preload.cjs --require ./mission-market-preload.cjs --require ./sponsorship/server.cjs dist/server.cjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/healthz"
healthcheckTimeout = 30

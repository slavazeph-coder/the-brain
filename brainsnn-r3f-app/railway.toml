# Railway config for the BrainSNN app (TypeScript/Vite SPA + bundled Express).
# This subdirectory is the Railway service root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway's startCommand overrides Docker CMD. Load each existing Express
# preload, including the additive Sponsor Studio, before the bundled server.
# sponsorship/tests/startup.test.cjs guards against these entrypoints drifting.
startCommand = "node --require ./brand-brain-preload.cjs --require ./mission-market-preload.cjs --require ./sponsorship/server.cjs dist/server.cjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/healthz"
healthcheckTimeout = 30

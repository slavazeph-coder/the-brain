<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainSNN | Robot policy testing</title>

    <meta name="description" content="Explore robot-policy test packs from 10 to 100,000 episodes, with transparent runtime-price estimates and visible assumptions. Try the arcade today; hosted testing is pending qualification." />
    <meta name="theme-color" content="#05070b" />
    <meta name="brainsnn-positioning" content="robot-pricing-transparent-v1" />
    <link rel="canonical" href="https://www.brainsnn.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are an enhancement, never a gate on first paint. `media="print"`
         makes the browser fetch without blocking render; onload promotes it to
         all media.

         There is deliberately no <noscript> fallback: Chromium still treats a
         stylesheet inside <noscript> as render-blocking even with JS enabled,
         which measured 12.7s to first paint here versus 0.27s without it. It
         would also buy nothing — this is a React SPA, so with JS disabled there
         is no content to style. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrainSNN" />
    <meta property="og:title" content="BrainSNN | Robot policy testing" />
    <meta property="og:description" content="Explore robot-policy test packs from 10 to 100,000 episodes, with transparent runtime-price estimates and visible assumptions. Try the arcade today; hosted testing is pending qualification." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->

    <meta name="twitter:image" content="https://www.brainsnn.com/og/robot-testing.png" />

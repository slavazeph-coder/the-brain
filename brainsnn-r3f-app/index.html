<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainSNN | Creative Decision Intelligence</title>

    <meta name="description" content="BrainSNN analyzes text, webpages and video creative for modelled attention, trust and risk signals, then turns those signals into concrete edits, comparisons and publishing decisions." />
    <meta name="theme-color" content="#030308" />
    <link rel="canonical" href="https://www.brainsnn.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are an enhancement, never a gate on first paint. `media="print"`
         makes the browser fetch without blocking render; onload promotes it to
         all media.

         There is deliberately no <noscript> fallback: Chromium still treats a
         stylesheet inside <noscript> as render-blocking even with JS enabled,
         which measured 12.7s to first paint here versus 0.27s without it. It
         would also buy nothing — this is a React SPA, so with JS disabled there
         is no content to style. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrainSNN" />
    <meta property="og:title" content="BrainSNN | Know what is likely to land before you publish" />
    <meta property="og:description" content="Analyze creative, inspect modelled attention/trust/risk signals, compare versions and turn the result into a concrete next edit." />
    <meta property="og:url" content="https://www.brainsnn.com/" />
    <meta property="og:image" content="https://www.brainsnn.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrainSNN | Creative Decision Intelligence" />
    <meta name="twitter:description" content="Analyze what you are about to publish, see the modelled signals, and get the next edit to make." />
    <meta name="twitter:image" content="https://www.brainsnn.com/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "BrainSNN",
        "alternateName": "BrainSNN Creative Decision Intelligence",
        "applicationCategory": "BusinessApplication",
        "description": "A web application for analyzing creative content, surfacing modelled attention, trust and risk signals, comparing versions and producing concrete publishing recommendations.",
        "url": "https://www.brainsnn.com/",
        "operatingSystem": "Web",
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

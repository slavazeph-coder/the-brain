name: Customer Ready Lockfile Generator

on:
  push:
    branches: [customer-ready-v1]
    paths:
      - '.github/workflows/customer-ready-lockgen.yml'

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - name: Generate hardened lockfile
        working-directory: brainsnn-r3f-app
        run: |
          npm install pg@^8.13.1 --save --package-lock-only
          npm audit fix --package-lock-only
          npm audit --audit-level=high
      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: customer-ready-manifests
          path: |
            brainsnn-r3f-app/package.json
            brainsnn-r3f-app/package-lock.json
          retention-days: 1

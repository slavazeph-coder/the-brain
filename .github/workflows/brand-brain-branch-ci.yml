name: Brand Brain Branch CI

on:
  push:
    branches:
      - brainsnn-brand-brain-v01

permissions:
  contents: read

concurrency:
  group: brand-brain-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brainsnn-r3f-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: MCP server smoke test
        working-directory: brainsnn-r3f-app/mcp-server
        run: |
          npm ci --no-audit --no-fund
          npm run smoke

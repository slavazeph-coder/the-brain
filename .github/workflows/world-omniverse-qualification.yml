name: World Omniverse qualification
on:
  pull_request:
    paths:
      - 'robotics/world_worker/**'
      - 'brainsnn-r3f-app/public/world/**'
      - 'tests/world/**'
      - 'scripts/world-demo/qualify_omniverse.py'
      - '.github/workflows/world-omniverse-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omniverse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  omniverse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install numpy==2.2.6 Pillow==11.3.0 usd-core==25.8 httpx==0.28.1 -r robotics/world_worker/requirements.txt
      - name: Source, package and real HTTP contracts
        run: |
          python -m unittest discover -s tests/world -p 'test_launch_extensions.py' -v
          python -m unittest discover -s tests/world -p 'test_omniverse_pack.py' -v
          python -m unittest discover -s tests/world -p 'test_omniverse_http.py' -v
          node --test tests/world/omniverse-ui.test.mjs
      - uses: actions/cache@v4
        with:
          path: /tmp/brainsnn-nvidia
          key: nvidia-simready-653d91e182011f357cf1644013cc94ddf194d349-IV-pole-a01-v1
      - name: Download pinned real NVIDIA package when not cached
        run: |
          if [ ! -d /tmp/brainsnn-nvidia/IV_pole_a01 ]; then
            python -m robotics.world_worker.nvidia_pack --workspace /tmp/brainsnn-nvidia
          fi
      - name: Verify, compose, archive, relocate and reopen real NVIDIA asset
        run: python scripts/world-demo/qualify_omniverse.py --workspace /tmp/brainsnn-nvidia --out /tmp/omniverse-real
      - name: Retain test receipts and exact source
        if: always()
        run: |
          mkdir -p qualification
          git archive --format=zip HEAD -o qualification/source.zip
          if [ -f /tmp/omniverse-real/result/qualification.json ]; then cp /tmp/omniverse-real/result/*.json qualification/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omniverse-qualification
          path: qualification/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: brainsnn-omniverse-demo-pack
          path: /tmp/omniverse-real/result/scene-omniverse.zip
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

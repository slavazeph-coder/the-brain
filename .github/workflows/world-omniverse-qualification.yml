name: World Omniverse qualification
on:
  pull_request:
    paths:
      - 'robotics/world_worker/**'
      - 'tests/world/**'
      - '.github/workflows/world-omniverse-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  omniverse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install USD test runtime
        run: python -m pip install numpy==2.2.6 Pillow==11.3.0 usd-core==25.8
      - name: Existing source and USD contracts
        run: python -m unittest discover -s tests/world -p 'test_launch_extensions.py' -v
      - name: Capture immutable package metadata (no asset execution)
        run: |
          mkdir -p qualification
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          root = Path('qualification')
          revision = '653d91e182011f357cf1644013cc94ddf194d349'
          urls = {
              'nvidia-package.json': f'https://huggingface.co/datasets/nvidia/simready-assets/resolve/{revision}/IV_pole_a01/com.nvidia.simready.packaging.json',
              'nvidia-files.json': f'https://huggingface.co/api/datasets/nvidia/simready-assets/tree/{revision}/IV_pole_a01?recursive=true&expand=false',
          }
          result = {}
          for name, url in urls.items():
              try:
                  with urllib.request.urlopen(url, timeout=45) as r:
                      data = r.read(2 * 1024**2 + 1)
                  if len(data) > 2 * 1024**2:
                      raise ValueError('metadata limit exceeded')
                  payload = json.loads(data)
                  (root / name).write_text(json.dumps(payload, indent=2))
                  result[name] = {'status':'downloaded', 'url':url, 'bytes':len(data)}
              except Exception as e:
                  result[name] = {'status':'failed', 'url':url, 'error':str(e)}
          (root / 'metadata-status.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - name: Retain exact source snapshot and portable USD wheel for offline checks
        run: |
          git archive --format=zip HEAD -o qualification/source.zip
          python -m pip download --no-deps --only-binary=:all: --python-version 313 --implementation cp --abi cp313 --platform manylinux_2_17_x86_64 usd-core==25.8 -d qualification/wheels || true
      - uses: actions/upload-artifact@v4
        with:
          name: omniverse-qualification
          path: qualification/
          retention-days: 7
          if-no-files-found: error

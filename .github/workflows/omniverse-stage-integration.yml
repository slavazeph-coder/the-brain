# One-time exact-source edit on the isolated Omniverse branch. Removed after application.
name: Apply source-bound Omniverse integration
on:
  pull_request:
    paths: ['.github/workflows/omniverse-stage-integration.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/omniverse-pack-integration-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact-source integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          paths = {'robotics/world_worker/app.py':'8ebf85de73d02ddcdbf87ca1a6b5c152e7192d5235bc2ad3b1620c223142d17b', 'brainsnn-r3f-app/public/world/bim-workflow-ui.mjs':'e11b7ae650fe3470c4365b27f8dca58f77e930b1bf4ff877020f6f7b97c162c8'}
          for path, sha in paths.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == sha, 'Concurrent source changed: ' + path
          p=Path('robotics/world_worker/app.py');s=p.read_text()
          s=s.replace("'.csv','.pgm','.yaml']", "'.csv','.pgm','.yaml','.zip']")
          block="    # Pinned operator-installed packages only; no downloads from user jobs.\n    simready_assets, simready_error = [], None\n    if engines.get('omniverse-pack', {}).get('available'):\n        try:\n            from .omniverse_pack import installed_assets\n            simready_assets = installed_assets(Path('/opt/brainsnn-simready'))\n        except Exception as error:\n            logging.getLogger(__name__).warning('SimReady catalog unavailable (%s)', type(error).__name__)\n            simready_error = 'Installed library failed verification; library additions unavailable.'\n"
          s=s.replace('    identities = Identities(token, tenants',block+'    identities = Identities(token, tenants')
          s=s.replace("                'owner_id':principal.owner_id, 'owner_limits':principal.limits,", "                'owner_id':principal.owner_id, 'owner_limits':principal.limits,\n                **({'simready_assets':simready_assets,'simready_error':simready_error}\n                   if 'omniverse-pack' in principal.engines and engines.get('omniverse-pack',{}).get('available') else {}),")
          compile(s,str(p),'exec');p.write_text(s)
          p=Path('brainsnn-r3f-app/public/world/bim-workflow-ui.mjs');s=p.read_text()
          s="import {mountOmniverse} from './omniverse-ui.mjs';\n"+s
          s=s.replace('let session={visual:null,key:null,picks:[],picking:false,readings:[]}, sceneContext=null,sceneEpoch=0;', 'let session={visual:null,key:null,picks:[],picking:false,readings:[]}, sceneContext=null,sceneEpoch=0,disposeOmniverse=null;')
          s=s.replace('function clearScene(){sceneEpoch++;', 'function clearScene(){disposeOmniverse?.();disposeOmniverse=null;sceneEpoch++;')
          s=s.replace('    renderOpenings();\n  }','    renderOpenings();\n    if(signal?.aborted||sceneContext!==context)return;\n    disposeOmniverse=mountOmniverse({host:files,context,sceneSha,isCurrent:()=>sceneContext===context,status,event});\n  }',1)
          p.write_text(s)
          PY
          node --check brainsnn-r3f-app/public/world/bim-workflow-ui.mjs
          node --test tests/world/omniverse-ui.test.mjs
      - name: Commit only the two reviewed integration files without force
        run: |
          git config user.name 'BrainSNN build automation'
          git config user.email 'build@users.noreply.github.com'
          git add robotics/world_worker/app.py brainsnn-r3f-app/public/world/bim-workflow-ui.mjs
          git commit -m 'feat(world): connect Omniverse packages to worker and reviewed scene UI'
          git push origin HEAD:codex/omniverse-pack-integration-20261027

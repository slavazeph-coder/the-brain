name: GT3 lab verification
on:
  pull_request:
    paths:
      - 'brainsnn-r3f-app/sponsorship/gt3/**'
      - 'brainsnn-r3f-app/sponsorship/tests/gt3.test.cjs'
      - '.github/workflows/gt3-lab.yml'
  push:
    branches: [main]
    paths:
      - 'brainsnn-r3f-app/sponsorship/gt3/**'
      - '.github/workflows/gt3-lab.yml'
permissions:
  contents: read
jobs:
  gt3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: brainsnn-r3f-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test sponsorship/tests/gt3.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Isolated HTTP, UI and read-only provider check
        env:
          GT3_REAL_MODEL: 'true'
        run: node sponsorship/gt3/tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt3-lab-verification
          path: brainsnn-r3f-app/sponsorship/gt3/reports/
          retention-days: 7

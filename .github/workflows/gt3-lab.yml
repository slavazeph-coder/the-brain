name: GT3 lab verification
on:
  pull_request:
    paths:
      - 'brainsnn-r3f-app/sponsorship/gt3/**'
      - 'brainsnn-r3f-app/sponsorship/tests/gt3.test.cjs'
      - '.github/workflows/gt3-lab.yml'
  push:
    branches: [main]
    paths:
      - 'brainsnn-r3f-app/sponsorship/gt3/**'
      - '.github/workflows/gt3-lab.yml'
permissions:
  contents: read
concurrency:
  group: gt3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gt3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brainsnn-r3f-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test sponsorship/tests/gt3.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Isolated HTTP and UI contracts
        run: node sponsorship/gt3/tests/browser.mjs
      - name: Real external provider, no production submissions
        run: node sponsorship/gt3/tests/provider-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt3-lab-verification
          path: brainsnn-r3f-app/sponsorship/gt3/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gt3-final-source
          path: |
            brainsnn-r3f-app/sponsorship/gt3/public/
            brainsnn-r3f-app/sponsorship/gt3/server.cjs
            brainsnn-r3f-app/sponsorship/gt3/THIRD-PARTY.md
          retention-days: 7

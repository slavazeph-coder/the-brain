name: World Builder contracts

on:
  pull_request:
    paths:
      - "brainsnn-r3f-app/public/world/**"
      - "brainsnn-r3f-app/public/arena/site-core.js"
      - "brainsnn-r3f-app/public/arena/site-renderer.js"
      - "brainsnn-r3f-app/src/arena/site-renderer.js"
      - "brainsnn-r3f-app/src/world/**"
      - "brainsnn-r3f-app/src/server/worldWorkerProxy*"
      - "brainsnn-r3f-app/src/App.tsx"
      - "brainsnn-r3f-app/src/lib/routeMeta*"
      - "brainsnn-r3f-app/index.html"
      - "brainsnn-r3f-app/server.ts"
      - "brainsnn-r3f-app/package*.json"
      - "robotics/world_worker/**"
      - "robotics/scene_compiler/**"
      - "robotics/arena/inspection/interop.py"
      - "tests/world/**"
      - "tests/scene_compiler/**"
      - "scripts/world-demo/**"
      - ".github/workflows/world-builder-checks.yml"
      - ".github/workflows/brainsnn-app-deploy.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  world-contracts:
    runs-on: ubuntu-24.04
    # Bound each download phase separately, leaving time for the unchanged tests on a cold runner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            tests/world/requirements-ci.txt
            robotics/world_worker/requirements.txt
            robotics/world_worker/requirements-colmap.txt
            robotics/world_worker/requirements-comparison.txt
            robotics/world_worker/requirements-observations.txt
      - name: Install app dependencies
        working-directory: brainsnn-r3f-app
        run: npm ci --no-audit --no-fund
      - name: World geometry, import, viewer parsing and worker client contracts
        working-directory: brainsnn-r3f-app
        run: npm run test:world
      # Azure's Ubuntu mirror has served the FFmpeg and WebKit .debs at ~50 KB/s, running this job past
      # its timeout. Restore earlier downloads so apt only fetches what changed, and save them even when the
      # job fails or times out, so a stalled run still leaves the next one less to fetch.
      - name: Restore downloaded Ubuntu packages
        id: apt-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives
          key: world-apt-ubuntu-24.04-${{ hashFiles('tests/world/requirements-ci.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            world-apt-ubuntu-24.04-${{ hashFiles('tests/world/requirements-ci.txt') }}-
            world-apt-ubuntu-24.04-
      - name: Install CPU worker test dependencies
        timeout-minutes: 5
        run: python -m pip install -r tests/world/requirements-ci.txt
      - name: Restore Playwright browser binaries
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: world-browsers-ubuntu-24.04-${{ hashFiles('tests/world/requirements-ci.txt') }}
      - name: Install Playwright browser binaries with a bounded retry
        id: browser-install
        timeout-minutes: 7
        run: |
          # A CDN connection once took ten minutes before Playwright retried at full speed.
          # Limit the whole attempt, not just the socket-connect timeout. Use the Python SDK's version.
          if ! timeout --kill-after=10 180 python -m playwright install chromium webkit; then
            echo "::warning::Browser download stalled; retrying with a fresh connection."
            timeout --kill-after=10 180 python -m playwright install chromium webkit
          fi
      - name: Save completed browser binaries before later steps can fail
        if: always() && steps.browser-install.outcome == 'success' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: world-browsers-ubuntu-24.04-${{ hashFiles('tests/world/requirements-ci.txt') }}
      - name: Install FFmpeg and browser system dependencies
        timeout-minutes: 9
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/apt-archives" | sudo tee /etc/apt/apt.conf.d/90world-archives
          sudo apt-get update
          # Download FFmpeg and Playwright's system packages first: a download can be stopped safely, an install cannot.
          # If the mirror stalls, fetch the rest from archive.ubuntu.com; completed .debs are kept either way.
          packages="ffmpeg $(python -m playwright install-deps --dry-run chromium webkit | sed -n 's/^  \([a-z0-9][^ ]*\)$/\1/p' | tr '\n' ' ')"
          fetch() { sudo timeout 180 apt-get install -y --download-only --no-install-recommends $packages; }
          if ! fetch; then
            echo "::warning::The Ubuntu mirror stalled; fetching the remaining packages from archive.ubuntu.com."
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
            sudo apt-get update
            fetch
          fi
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m playwright install-deps chromium webkit
          sudo apt-get autoclean -y
      - name: Hand downloaded Ubuntu packages to the runner user
        if: always() && steps.apt-restore.outcome == 'success'
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
      - name: Save downloaded Ubuntu packages
        if: always() && steps.apt-restore.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives
          key: world-apt-ubuntu-24.04-${{ hashFiles('tests/world/requirements-ci.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Worker tenant isolation, reconstruction and observations with explicit fake VLM transport
        run: python -m pytest tests/world/test_worker.py tests/world/test_tenant_isolation.py tests/world/test_observations.py tests/world/test_benchmark_eth3d.py tests/world/test_check_worker.py tests/world/test_densify.py tests/world/test_object_names.py tests/world/test_cad_export.py tests/world/test_building_handoff.py tests/world/test_building_handoff_pipeline.py tests/world/test_fit_check.py tests/world/test_measurement_check.py tests/world/test_demo_regeneration.py tests/world/test_bim_review.py tests/world/test_scene_name_reuse.py tests/world/test_benchmark_tools.py tests/world/test_reference_scale.py tests/world/test_mapanything_cameras.py tests/world/test_camera_frames.py tests/world/test_colmap_frame_evidence.py tests/world/test_mapanything_frame_evidence.py tests/world/test_reconstruction_frame_binding.py tests/world/test_component_evidence.py tests/world/test_component_fit.py tests/world/test_video_qualification.py tests/world/test_qualify_video_cli.py tests/world/test_site_worker_deploy.py tests/scene_compiler/test_refine_components.py tests/scene_compiler/test_component_graph.py tests/scene_compiler/test_nav2_export.py tests/scene_compiler/test_rebuild_components.py tests/world/test_native_capture.py tests/world/test_site_processing_check.py tests/scene_compiler/test_geometry.py tests/scene_compiler/test_ifc_export.py tests/scene_compiler/test_scene_usd.py -q tests/world/test_lingbot_map.py tests/world/test_comparison_measurements.py tests/world/test_comparison_vggt.py tests/world/test_reconstruction_comparison.py tests/world/test_reconstruction_qualification.py
      - name: Scene compiler and scene-usd hand-off contracts (no Blender or COLMAP)
        run: python -m unittest tests.scene_compiler.test_geometry tests.scene_compiler.test_scene_usd tests.scene_compiler.test_ifc_export
      - name: Build production app
        working-directory: brainsnn-r3f-app
        run: npm run build
      - name: Real HTTP desktop and phone-sized Chromium and WebKit flows
        env:
          WORLD_URL: http://127.0.0.1:4180/
          WORLD_SITE_URL: http://127.0.0.1:4180
          WORLD_BROWSERS: chromium,webkit
          # Model inference is an opt-in qualification, not a mocked CI output.
          WORLD_PHOTO: ""
        run: |
          mkdir -p output/playwright/world
          (cd brainsnn-r3f-app && NODE_ENV=production PORT=4180 node dist/server.cjs) > output/playwright/world/server.log 2>&1 &
          world_server_pid=$!
          trap 'kill "$world_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4180/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4180/healthz >/dev/null
          python tests/world/browser_smoke.py
          # Native street workspace uses the actual Express asset transport, shadow DOM, edits and exports.
          python tests/world/street_browser_smoke.py
          # Same-origin IndexedDB file handoff; no upload or external model calls.
          python tests/world/capture_handoff_browser_smoke.py
          # Permission fixtures test cancellation; native canvas MP4 is separate
          # from physical phone/camera qualification.
          python tests/world/capture_browser_smoke.py
          # Original capture hashes and consent, then real CPU reconstruction of an authored synthetic room.
          python tests/world/native_capture_browser_smoke.py
          # Reconstruction -> proposed map -> review gate -> plan, on a synthetic room in an arbitrary frame.
          python tests/world/realtosim_browser_smoke.py
          # brainsnn.com's own processing: passcode -> the site's /api/world proxy -> a real worker -> cloud loaded.
          python tests/world/site_processing_browser_smoke.py
          # Reuse the Python SDK's installed binaries with the npm test driver.
          python - <<'PY'
          import os, subprocess
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              env = dict(os.environ, WORLD_URL='http://127.0.0.1:4180/world/index.html',
                         PLAYWRIGHT_CHROMIUM_PATH=playwright.chromium.executable_path,
                         PLAYWRIGHT_WEBKIT_PATH=playwright.webkit.executable_path)
              subprocess.run(['node', 'tests/world/visual-browser-smoke.mjs'], env=env, check=True)
          PY
      - name: Observations HTTP worker and review flows with explicit fixture VLM
        env:
          WORLD_BROWSERS: chromium,webkit
        run: python tests/world/observations_browser_smoke.py
      - name: Simulation scene preview over the HTTP worker with a transport fixture (no Blender)
        env:
          WORLD_BROWSERS: chromium,webkit
          WORLD_PHONE_VIEWPORT: "1"
        run: python tests/world/scene_browser_smoke.py
      - name: Retain World Builder browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-builder-browser
          path: output/playwright/world/
          if-no-files-found: warn
          retention-days: 7

name: World biomechanics runtime

on:
  pull_request:
    paths:
      - 'robotics/biomechanics/**'
      - 'robotics/world_worker/biomechanics.py'
      - 'robotics/world_worker/app.py'
      - 'tests/world/test_biomechanics*.py'
      - 'tests/world/biomechanics_browser_smoke.py'
      - 'brainsnn-r3f-app/public/world/**'
      - '.github/workflows/world-biomechanics-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'robotics/biomechanics/**'
      - 'robotics/world_worker/biomechanics.py'
      - 'robotics/world_worker/app.py'
      - 'tests/world/test_biomechanics*.py'
      - 'tests/world/biomechanics_browser_smoke.py'
      - 'brainsnn-r3f-app/public/world/**'
      - '.github/workflows/world-biomechanics-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: biomechanics-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-opensim-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install and verify the pinned native OpenSim wheel
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/biomechanics
          git rev-parse HEAD > output/biomechanics/brainsnn-source-sha.txt
          python -m venv "$RUNNER_TEMP/opensim"
          "$RUNNER_TEMP/opensim/bin/python" -m robotics.biomechanics.setup_runtime 2>&1 | tee output/biomechanics/install.log
          "$RUNNER_TEMP/opensim/bin/python" -m pip check
          "$RUNNER_TEMP/opensim/bin/python" -m pip freeze > output/biomechanics/dependencies.txt
          cp "$RUNNER_TEMP/opensim/brainsnn-opensim-runtime.json" output/biomechanics/
      - name: Qualify actual geometry and inverse dynamics against analytic torque
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/opensim/bin/python" -m robotics.biomechanics.qualify --out output/biomechanics/qualification \
            2>&1 | tee output/biomechanics/native.log
      - name: Exercise input admission and real native adapter contracts
        shell: bash
        run: |
          "$RUNNER_TEMP/opensim/bin/python" -m pip install -r robotics/world_worker/requirements.txt pytest==9.1.1 httpx==0.28.1
          WORLD_BIOMECHANICS_TEST_PYTHON="$RUNNER_TEMP/opensim/bin/python" \
            "$RUNNER_TEMP/opensim/bin/python" -m pytest tests/world/test_biomechanics.py tests/world/test_biomechanics_worker.py tests/world/test_biomechanics_acceptance.py -q
      - name: Install isolated browser dependencies
        if: ${{ hashFiles('brainsnn-r3f-app/public/world/biomechanics-tool.mjs') != '' && hashFiles('tests/world/biomechanics_browser_smoke.py') != '' }}
        timeout-minutes: 7
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/biomechanics-browser"
          "$RUNNER_TEMP/biomechanics-browser/bin/python" -m pip install -r robotics/world_worker/requirements.txt playwright==1.64.0
          # The runner's Azure mirror has repeatedly stalled browser packages;
          # use the official Ubuntu archive and bound both download phases.
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          "$RUNNER_TEMP/biomechanics-browser/bin/python" -m playwright install-deps chromium webkit
          timeout --kill-after=10 180 "$RUNNER_TEMP/biomechanics-browser/bin/python" -m playwright install chromium webkit
      - name: Exercise native analysis through Chromium and WebKit
        if: ${{ hashFiles('brainsnn-r3f-app/public/world/biomechanics-tool.mjs') != '' && hashFiles('tests/world/biomechanics_browser_smoke.py') != '' }}
        shell: bash
        run: |
          set -o pipefail
          WORLD_BIOMECHANICS_TEST_PYTHON="$RUNNER_TEMP/opensim/bin/python" \
            "$RUNNER_TEMP/biomechanics-browser/bin/python" tests/world/biomechanics_browser_smoke.py \
            2>&1 | tee output/biomechanics/browser.log
      - name: Preserve native solver and browser receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: biomechanics-cpu-qualification
          path: |
            output/biomechanics/
            output/playwright/world/biomechanics-*
          retention-days: 14
          if-no-files-found: warn

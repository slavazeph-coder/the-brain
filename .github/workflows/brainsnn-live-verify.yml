name: Verify BrainSNN live deploy

# Runs when Railway's GitHub deploy reports a successful production deployment,
# or on demand. It proves the live site serves this commit's public files byte
# for byte and still carries the World Builder, Classic, Arena and analysis
# release markers. It reads only public URLs and needs no secrets.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

# Railway posts in_progress, success and inactive statuses. Grouping by state means a
# later status for another deployment never cancels a running success verification,
# while a newer successful deploy does supersede an older one still being verified.
concurrency:
  group: brainsnn-live-verify-${{ github.event.deployment_status.state || 'manual' }}
  cancel-in-progress: true

jobs:
  verify-live-deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Live files match this commit
        env:
          SITE: ${{ vars.BRAINSNN_SITE_URL || 'https://www.brainsnn.com' }}
        run: |
          # Static World Builder and Arena files are served verbatim from public/,
          # so equal bytes prove this exact build is live (not an older container).
          files="world/index.html world/app.mjs world/sw.js world/detections.mjs world/reconstruction-map.mjs world/api.html arena/site-workspace.js"
          for attempt in $(seq 1 20); do
            stale=""
            for f in $files; do
              want="$(sha256sum "brainsnn-r3f-app/public/$f" | cut -c1-64)"
              got="$(curl -fsSL --max-time 20 "$SITE/$f" 2>/dev/null | sha256sum | cut -c1-64)"
              [ "$want" = "$got" ] || stale="$stale $f"
            done
            if [ -z "$stale" ]; then
              echo "Live site serves $(git rev-parse --short HEAD) for: $files"
              exit 0
            fi
            echo "attempt $attempt → still stale:$stale"
            sleep 30
          done
          echo "Live site never served this commit's files:$stale" >&2
          exit 1

      - name: Live site serves the World Builder, Classic, Arena and analysis builds
        env:
          HEALTH_URL: ${{ vars.BRAINSNN_HEALTH_URL || 'https://www.brainsnn.com/healthz' }}
          # The SPA shell carries the current BrainSNN product title. Checking it
          # proves the World Builder homepage build rolled out, not merely that an
          # older container is still answering health checks.
          HOME_URL: ${{ vars.BRAINSNN_SITE_HOME_URL || 'https://www.brainsnn.com/' }}
          WORLD_URL: https://www.brainsnn.com/world/index.html
          CLASSIC_URL: https://www.brainsnn.com/?classic=1
          ARENA_URL: https://www.brainsnn.com/arena/
          ANALYSIS_CAPABILITIES_URL: https://www.brainsnn.com/api/arena/analysis/capabilities
          ANALYSIS_ASSET_URL: https://www.brainsnn.com/arena/arena-analysis.js
        run: |
          for i in $(seq 1 30); do
            health="$(curl -L -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)"
            home="$(curl -L -s -o /tmp/brainsnn-home.html -w '%{http_code}' "$HOME_URL" || true)"
            world="$(curl -L -s -o /tmp/brainsnn-world.html -w '%{http_code}' "$WORLD_URL" || true)"
            classic="$(curl -L -s -o /tmp/brainsnn-classic.html -w '%{http_code}' "$CLASSIC_URL" || true)"
            arena="$(curl -L -s -o /tmp/brainsnn-arena.html -w '%{http_code}' "$ARENA_URL" || true)"
            analysis="$(curl -L -s -o /tmp/brainsnn-analysis.json -w '%{http_code}' "$ANALYSIS_CAPABILITIES_URL" || true)"
            analysis_asset="$(curl -L -s -o /tmp/brainsnn-analysis.js -w '%{http_code}' "$ANALYSIS_ASSET_URL" || true)"
            if [ "$home" = "200" ] && grep -Fq "BrainSNN | World Builder" /tmp/brainsnn-home.html && grep -Fq "world-builder-v1" /tmp/brainsnn-home.html && [ "$world" = "200" ] && grep -Fq "BrainSNN | World Builder" /tmp/brainsnn-world.html && grep -Fq "world-builder-v1" /tmp/brainsnn-world.html; then
              home_marker="ok"
            else
              home_marker="missing"
            fi
            if [ "$classic" = "200" ] && grep -Fq 'BrainSNN | Robot policy testing' /tmp/brainsnn-classic.html && grep -Fq 'robot-pricing-transparent-v1' /tmp/brainsnn-classic.html && grep -Fq 'US$171.43' /tmp/brainsnn-classic.html; then
              classic_marker="ok"
            else
              classic_marker="missing"
            fi
            if [ "$arena" = "200" ] && grep -Fq '2026-10-17-arena-inspection-1' /tmp/brainsnn-arena.html && grep -Fq 'arena-arcade-selection-2026-10-17-v1' /tmp/brainsnn-arena.html && grep -Fq 'robot-pricing-transparent-v1' /tmp/brainsnn-arena.html; then
              arena_marker="ok"
            else
              arena_marker="missing"
            fi
            if [ "$analysis" = "200" ] && node -e 'const c=require("/tmp/brainsnn-analysis.json");if(c.build!=="paid-analysis-2026-10-17-v1"||typeof c.analysisEnabled!=="boolean"||typeof c.purchaseEnabled!=="boolean")process.exit(1)' && [ "$analysis_asset" = "200" ] && grep -Fq 'paid-analysis-2026-10-17-v1' /tmp/brainsnn-analysis.js; then
              analysis_marker="ok"
            else
              analysis_marker="missing"
            fi
            echo "attempt $i → healthz $health, home $home/$home_marker, world $world, classic $classic/$classic_marker, arena $arena/$arena_marker, analysis $analysis/$analysis_marker"
            if [ "$health" = "200" ] && [ "$home_marker" = "ok" ] && [ "$classic_marker" = "ok" ] && [ "$arena_marker" = "ok" ] && [ "$analysis_marker" = "ok" ]; then
              echo "Live service is healthy and serving the current BrainSNN build."
              exit 0
            fi
            sleep 20
          done
          echo "Service never became healthy on the current build ($HEALTH_URL / $HOME_URL)" >&2
          exit 1

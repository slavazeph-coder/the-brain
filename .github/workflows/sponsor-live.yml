name: Sponsor live verification
on:
  workflow_run:
    workflows: ['Verify BrainSNN live deploy']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-site:
    # A worker deployment is not a website release; workflow_run retains its source branch.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Skipped worker events must not cancel a running website check.
    concurrency:
      group: sponsor-live-verification
      cancel-in-progress: true
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brainsnn-r3f-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - name: Install browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps
      - name: Verify HTTPS routes, actual robot rendering and application UI
        run: node sponsorship/tests/live.mjs
      - name: Upload public-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-live-${{ github.run_number }}
          path: brainsnn-r3f-app/sponsorship/reports/live/
          retention-days: 14
          if-no-files-found: error

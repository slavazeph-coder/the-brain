name: Deploy BrainSNN app to Railway

# Deploys brainsnn-r3f-app (a TypeScript/Vite SPA served by an esbuild-bundled
# Express server) to the Railway service that backs brainsnn.com. Requires the
# RAILWAY_TOKEN repository secret; project/service/health defaults can be
# overridden with repository variables.

on:
  push:
    branches:
      - main
    paths:
      - "brainsnn-r3f-app/**"
      - "robotics/world_worker/**"
      - "tests/world/**"
      - "Dockerfile"
      - "railway.toml"
      - ".github/workflows/brainsnn-app-deploy.yml"
      - ".github/workflows/world-builder-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brainsnn-app-deploy
  cancel-in-progress: true

jobs:
  world-checks:
    uses: ./.github/workflows/world-builder-checks.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brainsnn-r3f-app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Paid analysis accounting, evidence and service contracts
        run: npm run test:analysis

      - name: Build
        run: npm run build

      - name: Engine API smoke test
        run: node scripts/engine-api-smoke.mjs

      - name: Robot Arena routes and published assets
        run: node scripts/test-arena-route.mjs --dist

      - name: Boot-check the built server
        env:
          NODE_ENV: production
          PORT: "8080"
        run: |
          node dist/server.cjs &
          world_boot_pid=$!
          trap 'kill "$world_boot_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/ -o /tmp/brainsnn-home.html
          grep -Fq "BrainSNN | World Builder" /tmp/brainsnn-home.html
          grep -Fq "world-builder-v1" /tmp/brainsnn-home.html
          curl -fsS http://127.0.0.1:8080/world/index.html -o /tmp/brainsnn-world.html
          grep -Fq "BrainSNN | World Builder" /tmp/brainsnn-world.html
          grep -Fq "world-builder-v1" /tmp/brainsnn-world.html
          curl -fsS 'http://127.0.0.1:8080/?classic=1' -o /tmp/brainsnn-classic.html
          grep -Fq 'BrainSNN | Robot policy testing' /tmp/brainsnn-classic.html
          grep -Fq 'robot-pricing-transparent-v1' /tmp/brainsnn-classic.html
          grep -Fq 'US$171.43' /tmp/brainsnn-classic.html
          curl -fsS http://127.0.0.1:8080/arena/ -o /tmp/brainsnn-arena.html
          grep -Fq 'robot-pricing-transparent-v1' /tmp/brainsnn-arena.html
          curl -sf http://127.0.0.1:8080/api/arena/analysis/capabilities | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const c=JSON.parse(s);if(c.build!=="paid-analysis-2026-10-17-v1"||c.analysisEnabled!==false||c.purchaseEnabled!==false)process.exit(1);})'

  deploy:
    runs-on: ubuntu-latest
    needs: [build, world-checks]
    timeout-minutes: 15
    environment:
      name: production
      url: https://brainsnn.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || 'c7f26b12-f812-4785-bbaf-a49b9caeb228' }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'the-brain' }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is required for the deploy." >&2
            exit 1
          fi
          test -f Dockerfile
          test -f railway.toml
          test -f brainsnn-r3f-app/package.json
          # Upload the repo; Railway builds the service-rooted Dockerfile.
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --ci

      - name: Healthcheck
        env:
          HEALTH_URL: ${{ vars.BRAINSNN_HEALTH_URL || 'https://www.brainsnn.com/healthz' }}
          # The SPA shell carries the current BrainSNN product title. Checking it
          # proves the World Builder homepage build rolled out, not merely that an
          # older container is still answering health checks.
          HOME_URL: ${{ vars.BRAINSNN_SITE_HOME_URL || 'https://www.brainsnn.com/' }}
          WORLD_URL: https://www.brainsnn.com/world/index.html
          CLASSIC_URL: https://www.brainsnn.com/?classic=1
          ARENA_URL: https://www.brainsnn.com/arena/
          ANALYSIS_CAPABILITIES_URL: https://www.brainsnn.com/api/arena/analysis/capabilities
          ANALYSIS_ASSET_URL: https://www.brainsnn.com/arena/arena-analysis.js
        run: |
          for i in $(seq 1 30); do
            health="$(curl -L -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)"
            home="$(curl -L -s -o /tmp/brainsnn-home.html -w '%{http_code}' "$HOME_URL" || true)"
            world="$(curl -L -s -o /tmp/brainsnn-world.html -w '%{http_code}' "$WORLD_URL" || true)"
            classic="$(curl -L -s -o /tmp/brainsnn-classic.html -w '%{http_code}' "$CLASSIC_URL" || true)"
            arena="$(curl -L -s -o /tmp/brainsnn-arena.html -w '%{http_code}' "$ARENA_URL" || true)"
            analysis="$(curl -L -s -o /tmp/brainsnn-analysis.json -w '%{http_code}' "$ANALYSIS_CAPABILITIES_URL" || true)"
            analysis_asset="$(curl -L -s -o /tmp/brainsnn-analysis.js -w '%{http_code}' "$ANALYSIS_ASSET_URL" || true)"
            if [ "$home" = "200" ] && grep -Fq "BrainSNN | World Builder" /tmp/brainsnn-home.html && grep -Fq "world-builder-v1" /tmp/brainsnn-home.html && [ "$world" = "200" ] && grep -Fq "BrainSNN | World Builder" /tmp/brainsnn-world.html && grep -Fq "world-builder-v1" /tmp/brainsnn-world.html; then
              home_marker="ok"
            else
              home_marker="missing"
            fi
            if [ "$classic" = "200" ] && grep -Fq 'BrainSNN | Robot policy testing' /tmp/brainsnn-classic.html && grep -Fq 'robot-pricing-transparent-v1' /tmp/brainsnn-classic.html && grep -Fq 'US$171.43' /tmp/brainsnn-classic.html; then
              classic_marker="ok"
            else
              classic_marker="missing"
            fi
            if [ "$arena" = "200" ] && grep -Fq '2026-10-17-arena-inspection-1' /tmp/brainsnn-arena.html && grep -Fq 'arena-arcade-selection-2026-10-17-v1' /tmp/brainsnn-arena.html && grep -Fq 'robot-pricing-transparent-v1' /tmp/brainsnn-arena.html; then
              arena_marker="ok"
            else
              arena_marker="missing"
            fi
            if [ "$analysis" = "200" ] && node -e 'const c=require("/tmp/brainsnn-analysis.json");if(c.build!=="paid-analysis-2026-10-17-v1"||typeof c.analysisEnabled!=="boolean"||typeof c.purchaseEnabled!=="boolean")process.exit(1)' && [ "$analysis_asset" = "200" ] && grep -Fq 'paid-analysis-2026-10-17-v1' /tmp/brainsnn-analysis.js; then
              analysis_marker="ok"
            else
              analysis_marker="missing"
            fi
            echo "attempt $i → healthz $health, home $home/$home_marker, world $world, classic $classic/$classic_marker, arena $arena/$arena_marker, analysis $analysis/$analysis_marker"
            if [ "$health" = "200" ] && [ "$home_marker" = "ok" ] && [ "$classic_marker" = "ok" ] && [ "$arena_marker" = "ok" ] && [ "$analysis_marker" = "ok" ]; then
              echo "Live service is healthy and serving the current BrainSNN build."
              exit 0
            fi
            sleep 20
          done
          echo "Service never became healthy on the current build ($HEALTH_URL / $HOME_URL)" >&2
          exit 1

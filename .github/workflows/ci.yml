name: CI

# Gates every pull request (and non-main branch push) that touches the app:
# typecheck, the deterministic test suite, a production build, and the stdio
# MCP server smoke test. Runs before the Railway deploy workflow (which is
# push-to-main only), so red tests block a merge instead of shipping.

on:
  pull_request:
    paths:
      - "brainsnn-r3f-app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brainsnn-r3f-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: MCP server smoke test
        working-directory: brainsnn-r3f-app/mcp-server
        run: |
          npm ci --no-audit --no-fund
          npm run smoke

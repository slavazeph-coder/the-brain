name: CI

# Gates every pull request that touches the app or its deployment workflow:
# typecheck, the deterministic test suite, a production build, and the stdio
# MCP server smoke test. The push-to-main deploy workflow repeats the production
# build gate before Railway receives a release.

on:
  pull_request:
    paths:
      - "brainsnn-r3f-app/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/brainsnn-app-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brainsnn-r3f-app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Engine API smoke test
        run: node scripts/engine-api-smoke.mjs

      - name: MCP server smoke test
        working-directory: brainsnn-r3f-app/mcp-server
        run: |
          npm ci --no-audit --no-fund
          npm run smoke

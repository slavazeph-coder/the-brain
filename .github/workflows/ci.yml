name: CI

# Gates every pull request that touches the app or its deployment workflow:
# dependency audit, typecheck, the deterministic test suite, a production build,
# and the stdio MCP server smoke test. The push-to-main deploy workflow repeats
# the production gates before Railway receives a release.

on:
  pull_request:
    paths:
      - "brainsnn-r3f-app/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/brainsnn-app-deploy.yml"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: brainsnn-r3f-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: MCP server smoke test
        working-directory: brainsnn-r3f-app/mcp-server
        run: |
          npm ci --no-audit --no-fund
          npm run smoke

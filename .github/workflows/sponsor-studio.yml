name: Sponsor Studio
on:
  push:
    branches: [feat/brainsnn-sponsor-studio, main]
    paths:
      - 'brainsnn-r3f-app/sponsorship/**'
      - 'brainsnn-r3f-app/Dockerfile'
      - 'brainsnn-r3f-app/railway.toml'
      - 'brainsnn-r3f-app/package.json'
      - '.github/workflows/sponsor-studio.yml'
  pull_request:
    paths:
      - 'brainsnn-r3f-app/sponsorship/**'
      - 'brainsnn-r3f-app/Dockerfile'
      - 'brainsnn-r3f-app/railway.toml'
      - 'brainsnn-r3f-app/package.json'
      - '.github/workflows/sponsor-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sponsor-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: brainsnn-r3f-app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - name: Install existing app and server-only Stripe SDK
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix sponsorship --omit=dev --no-audit --no-fund
      - name: Build pinned G1 geometry and browser renderer
        run: |
          mkdir -p sponsorship/reports
          node sponsorship/build.cjs 2>&1 | tee sponsorship/reports/model-build.log
          node --input-type=module --check < sponsorship/public/app.js
          node --input-type=module --check < sponsorship/public/admin.js
          node --input-type=module --check < sponsorship/public/checkout.js
      - name: Test private applications, signed payment flow and startup consistency
        run: |
          SPONSOR_SKIP_PRELOAD=true node --test sponsorship/tests/*.test.cjs 2>&1 | tee sponsorship/reports/server-tests.log
      - name: Install browser
        run: npx playwright install chromium --with-deps
      - name: Desktop, mobile, robot decals and application QA
        run: |
          node sponsorship/tests/browser.mjs
          node -e "const v=require('./sponsorship/reports/accessibility.json'); const bad=v.filter(x=>['critical','serious'].includes(x.impact)); if(bad.length){console.error(JSON.stringify(bad.map(x=>({id:x.id,nodes:x.nodes.map(n=>n.target)})),null,2));process.exit(1);} console.log('No critical or serious accessibility violations.');"
      - name: Existing BrainSNN regression checks
        run: |
          npm run lint
          npm test
          npm run build
          cd mcp-server
          npm ci --no-audit --no-fund
          npm run smoke
      - name: Verify routes using the command Railway actually runs
        env:
          NODE_ENV: test
          PORT: '8092'
          SPONSOR_DB_PATH: /tmp/brainsnn-runtime-sponsor.sqlite
          ORCHESTRATION_DB_PATH: /tmp/brainsnn-runtime-orchestration.sqlite
          SPONSOR_PUBLIC_ORIGIN: http://127.0.0.1:8092
          SPONSOR_PAYMENTS_ENABLED: 'false'
          SPONSOR_TAX_READY: 'false'
          BRAND_BRAIN_MEMORY_FALLBACK: 'true'
        run: |
          # Test the configuration that overrides Docker CMD, not a copied command.
          START_COMMAND="$(python3 -c 'import tomllib; print(tomllib.load(open("railway.toml", "rb"))["deploy"]["startCommand"])')"
          $START_COMMAND > sponsorship/reports/runtime-smoke.log 2>&1 &
          RUNTIME_PID=$!
          trap 'kill "$RUNTIME_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:8092';
          let ready=false;
          for(let n=0;n<60;n++){try{const r=await fetch(base+'/healthz');if(r.ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,500));}
          assert.ok(ready,'Existing BrainSNN runtime did not become healthy.');
          const home=await fetch(base+'/');assert.ok(home.ok,'Existing homepage failed.');
          const page=await fetch(base+'/sponsor/');assert.ok(page.ok,'Sponsor page failed inside full runtime.');assert.match(await page.text(),/Your brand/);
          const status=await (await fetch(base+'/api/sponsors/status')).json();assert.equal(status.storage,'persistent_sqlite');assert.equal(status.payments,'not_enabled');
          const catalog=await (await fetch(base+'/api/sponsors/catalog')).json();assert.equal(catalog.zones.length,8);
          assert.equal((await fetch(base+'/api/sponsors/admin/applications')).status,401);
          console.log('Railway-configured runtime: existing home/health and sponsor page, persistent API, catalogue and owner protection all pass.');
          NODE
      - name: Package build and evidence without credentials or databases
        if: always()
        run: |
          mkdir -p sponsorship/reports
          tar --exclude='node_modules' --exclude='.data' --exclude='*.sqlite*' --exclude='.env' -czf sponsor-studio-build.tar.gz sponsorship
      - name: Upload source, compiled assets and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-studio-${{ github.run_number }}
          path: |
            brainsnn-r3f-app/sponsor-studio-build.tar.gz
            brainsnn-r3f-app/sponsorship/reports/
          retention-days: 14
          if-no-files-found: warn

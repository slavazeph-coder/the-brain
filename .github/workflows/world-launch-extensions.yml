name: World launch extensions
on:
  pull_request:
    paths:
      - 'robotics/world_worker/simready_bridge.py'
      - 'robotics/world_worker/capture_evidence.py'
      - 'tests/world/test_launch_extensions.py'
      - 'tests/world/test_simready_instances.py'
      - 'robotics/scene_compiler/**'
      - 'tests/scene_compiler/test_geometry.py'
      - '.github/workflows/world-launch-extensions.yml'
  push:
    branches: [main]
    paths:
      - 'robotics/world_worker/simready_bridge.py'
      - 'robotics/world_worker/capture_evidence.py'
      - 'robotics/scene_compiler/**'
      - 'tests/world/test_launch_extensions.py'
      - 'tests/world/test_simready_instances.py'
      - 'tests/scene_compiler/test_geometry.py'
      - '.github/workflows/world-launch-extensions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU test dependencies
        run: python -m pip install numpy==2.2.6 Pillow==11.3.0 usd-core==25.8 pytest==9.1.1
      - name: Require real USD dependency rather than accepting skipped tests
        run: python -c 'from pxr import Usd, UsdGeom, UsdPhysics, Sdf'
      - name: Execute capture, evidence and USD roundtrip contracts
        run: python -m pytest tests/world/test_launch_extensions.py tests/world/test_simready_instances.py tests/scene_compiler/test_geometry.py -q

name: Meshlets lab browsers
on:
  pull_request:
    paths:
      - brainsnn-r3f-app/**
      - .github/workflows/meshlets-lab.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meshlets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: brainsnn-r3f-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainsnn-r3f-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Chromium and its system runtime
        run: npx playwright install --with-deps chromium
      - name: Real WebGL and WebGPU software-Vulkan tests, local GLB and receipts
        run: node scripts/test-meshlets-browser.mjs
      - name: Retain explicitly authored browser receipts and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meshlets-browser-diagnostics
          path: output/playwright/meshlets/
          retention-days: 7
          if-no-files-found: warn

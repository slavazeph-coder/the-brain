name: Neural Mirror research package

on:
  push:
    paths:
      - "neural-mirror/**"
      - ".github/workflows/neural-mirror.yml"
  pull_request:
    paths:
      - "neural-mirror/**"
      - ".github/workflows/neural-mirror.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neural-mirror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neural-mirror/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q

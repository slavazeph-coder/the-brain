name: GT3 local QA tools
on:
  push:
    branches: [fix/gt3-native-minimal]
    paths: ['.github/workflows/gt3-build-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: brainsnn-r3f-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Package only public npm renderer dependencies
        run: |
          tar -czf /tmp/gt3-tools.tgz node_modules/three node_modules/esbuild node_modules/@esbuild
          if [ -d node_modules/meshoptimizer ]; then tar -czf /tmp/gt3-mesh-tools.tgz node_modules/meshoptimizer; fi
      - uses: actions/upload-artifact@v4
        with:
          name: gt3-local-tools
          path: /tmp/gt3-*tools.tgz
          retention-days: 1

name: World G1 trial contracts
on:
  pull_request:
    paths:
      - 'robotics/g1_trial/**'
      - 'tests/g1_trial/**'
      - 'scripts/world-demo/qualify_g1_trial.py'
      - '.github/workflows/world-g1-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g1-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-contracts-not-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated CPU and USD dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install rsl-rl-lib==3.3.0 usd-core==25.8 numpy==2.2.6 Pillow==11.3.0
      - name: Validate preparation, measurement, outcome and blocked-runtime contracts
        run: |
          python -m compileall -q robotics/g1_trial
          python -m unittest discover -s tests/g1_trial -v
      - name: Run real matched policy and predictor on synthetic inputs
        run: python scripts/world-demo/qualify_g1_trial.py
      - name: Preserve exact tested source
        if: always()
        run: |
          mkdir -p qualification/g1-trial
          git archive --format=zip HEAD -o qualification/g1-trial/source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brainsnn-g1-trial-contracts
          path: qualification/g1-trial/
          retention-days: 7
